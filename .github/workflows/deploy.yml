name: Deploy to WordPress.org

# Publishing a GitHub Release with a tag like "1.0.1" pushes that version to the
# WordPress.org SVN repository and attaches the installable hipcall.zip to the release.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   SVN_USERNAME - WordPress.org username with commit access to the "hipcall" plugin
#   SVN_PASSWORD - SVN password from WordPress.org profile > Account & Security

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy Release to WordPress.org SVN
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check that tag, plugin header and readme versions match
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          HEADER=$(grep -oP '^\s*\*\s*Version:\s*\K[0-9.]+' hipcall.php)
          CONSTANT=$(grep -oP "define\(\s*'HIPCALL_VERSION',\s*'\K[0-9.]+" hipcall.php)
          STABLE=$(grep -oP '^Stable tag:\s*\K[0-9.]+' readme.txt)
          echo "tag=$TAG header=$HEADER constant=$CONSTANT stable=$STABLE"
          if [ "$TAG" != "$HEADER" ] || [ "$TAG" != "$CONSTANT" ] || [ "$TAG" != "$STABLE" ]; then
            echo "::error::Version mismatch. Update Version, HIPCALL_VERSION and Stable tag to $TAG."
            exit 1
          fi

      - name: WordPress Plugin Deploy
        id: deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          generate-zip: true
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: hipcall

      - name: Attach hipcall.zip to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "${{ steps.deploy.outputs.zip-path }}" --clobber
