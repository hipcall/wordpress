name: CI (Lint, Plugin Check & Tests)

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  phpcs:
    name: PHP Lint & WordPress Coding Standards
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['7.4', '8.3']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer, phpcs
          coverage: none

      - name: Check PHP syntax
        run: |
          find . -name "*.php" -not -path "./vendor/*" -print0 | xargs -0 -n1 php -l

      - name: Install WordPress Coding Standards
        run: |
          composer global config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --dev wp-coding-standards/wpcs:"^3.0"

      - name: Run PHPCS
        run: |
          $(composer global config bin-dir --absolute)/phpcs --standard=phpcs.xml.dist

  plugin-check:
    name: WordPress.org Plugin Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build distributable plugin (respecting .distignore)
        run: |
          mkdir -p build/hipcall
          rsync -a --exclude-from=.distignore --exclude=build ./ build/hipcall/

      - name: Run Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: './build/hipcall'

  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }}, WP ${{ matrix.wp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported combination (Requires at least / Requires PHP).
          - php: '7.4'
            wp: '6.3'
          # Latest WordPress release on the newest PHP.
          - php: '8.3'
            wp: 'latest'

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli
          tools: composer
          coverage: none

      - name: Install Composer dependencies
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Install WordPress ${{ matrix.wp }} and the test library
        run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1:3306 ${{ matrix.wp }} true

      - name: Run PHPUnit
        run: vendor/bin/phpunit

  jest:
    name: JavaScript tests (Jest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Run Jest
        run: npm test
